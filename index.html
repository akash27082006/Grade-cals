<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    
    <div class="card p-4 shadow w-100" style="max-width: 450px;">
        <h2 class="text-center mb-4">Grade Calculator</h2>

        <!-- FORM -->
        <form id="gradeForm">

            <div class="mb-3">
                <label class="form-label">Subject 1</label>
                <input type="number" class="form-control" id="sub1" placeholder="Enter marks">
            </div>

            <div class="mb-3">
                <label class="form-label">Subject 2</label>
                <input type="number" class="form-control" id="sub2">
            </div>

            <div class="mb-3">
                <label class="form-label">Subject 3</label>
                <input type="number" class="form-control" id="sub3">
            </div>

            <div class="mb-3">
                <label class="form-label">Subject 4</label>
                <input type="number" class="form-control" id="sub4">
            </div>

            <div class="mb-3">
                <label class="form-label">Subject 5</label>
                <input type="number" class="form-control" id="sub5">
            </div>

            <button type="button" class="btn btn-primary w-100" onclick="calculateGrade()">
                Calculate
            </button>

        </form>

        <!-- RESULT -->
        <div id="result" class="mt-4 text-center fw-bold"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
